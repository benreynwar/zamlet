site_name: Zamlet
repo_url: https://github.com/benreynwar/zamlet
repo_name: benreynwar/zamlet
edit_uri: ""
nav:
  - Home: index.md
  - Overview and Concepts:
    - Hierarchy: hierarchy.md
    - Instruction Flow: instruction_flow.md
    - Stripes, Lane Order and Element Width: stripe.md
    - Custom Instructions: custom_instructions.md
    - Memory Model: memory_model.md
  - Architecture:
    - Lamlet: lamlet.md
    - Kamlet Core: kamlet.md
    - Jamlet: jamlet.md
    - Network: network.md
    - Cache System: cache.md
    - Transfer System: transfer_system.md
    - Synchronization: synchronization.md
    - Systolic Array: systolic_array.md
  - Misc:
    - RISC-V Support: rvv.md
    - Risks: risks.md
    - Setup: setup.md
    - LLM Usage: llm.md
    - Current State: scope.md
  - Examples:
    - Gather Example: gather_example.md
theme:
  name: material
  features:
    - navigation.expand
    - navigation.sections
    - navigation.footer
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
markdown_extensions:
  - toc:
      title: On this page
extra_css:
  - extra/nav.css
